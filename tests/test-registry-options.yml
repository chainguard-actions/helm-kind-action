name: Test registry options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_only: "true"
          registry: "false"
          registry_image: "registry:2"
          registry_name: "kind-registry"
          registry_port: "5000"
          registry_enable_delete: "false"
          cloud_provider: "false"
      - name: Assert kind is installed
        run: |
          echo "Checking kind is installed..."
          if ! command -v kind &>/dev/null; then
            echo "FAIL: kind binary not found in PATH"
            exit 1
          fi
          KIND_VERSION=$(kind version)
          echo "kind version: $KIND_VERSION"
          echo "PASS: kind installed with registry options provided"
