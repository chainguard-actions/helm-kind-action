name: Test kind cluster with config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create kind config file
        run: |
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
          EOF

      - id: action
        uses: .
        with:
          cluster_name: "test-config-cluster"
          config: "/tmp/kind-config.yaml"
          wait: "60s"

      - name: Assert cluster is running
        run: |
          echo "Checking cluster nodes..."
          kubectl get nodes
          NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
          echo "Node count: $NODE_COUNT"
          if [ "$NODE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 node"
            exit 1
          fi
          echo "PASS: cluster created with config file"

      - name: Cleanup cluster
        if: always()
        run: kind delete cluster --name test-config-cluster || true
