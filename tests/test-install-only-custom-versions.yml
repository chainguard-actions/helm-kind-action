name: Test install only with custom kind and kubectl versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.27.0
          kubectl_version: v1.32.0
          install_only: "true"
          ignore_failed_clean: "true"
      - name: Assert kind version
        run: |
          OUT="$(kind version)"
          echo "kind version: $OUT"
          if ! echo "$OUT" | grep -q "v0.27.0"; then
            echo "FAIL: expected kind v0.27.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert kubectl version
        run: |
          OUT="$(kubectl version --client=true 2>&1)"
          echo "kubectl version: $OUT"
          if ! echo "$OUT" | grep -q "v1.32.0"; then
            echo "FAIL: expected kubectl v1.32.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache path uses custom version
        run: |
          if [ ! -x "$RUNNER_TOOL_CACHE/kind/v0.27.0/amd64/kind/bin/kind" ] && [ ! -x "$RUNNER_TOOL_CACHE/kind/v0.27.0/arm64/kind/bin/kind" ]; then
            echo "FAIL: kind binary not in expected cache dir"
            exit 1
          fi
          echo "PASS"
