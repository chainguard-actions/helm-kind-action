name: Test install only with default versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_only: "true"
          ignore_failed_clean: "true"
      - name: Assert kind is on PATH with default version
        run: |
          command -v kind || { echo "FAIL: kind not on PATH"; exit 1; }
          OUT="$(kind version)"
          echo "kind version: $OUT"
          if ! echo "$OUT" | grep -q "v0.33.0"; then
            echo "FAIL: expected kind v0.33.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert kubectl is on PATH with default version
        run: |
          command -v kubectl || { echo "FAIL: kubectl not on PATH"; exit 1; }
          OUT="$(kubectl version --client=true 2>&1)"
          echo "kubectl version: $OUT"
          if ! echo "$OUT" | grep -q "v1.37.1"; then
            echo "FAIL: expected kubectl v1.37.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert binaries are cached in tool cache
        run: |
          ls -R "$RUNNER_TOOL_CACHE/kind" | head -50
          FOUND="$(find "$RUNNER_TOOL_CACHE/kind/v0.33.0" -type f -name kind | head -1)"
          echo "found: $FOUND"
          if [ -z "$FOUND" ] || [ ! -x "$FOUND" ]; then
            echo "FAIL: cached kind binary not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert no cluster was created
        run: |
          if command -v docker >/dev/null 2>&1; then
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -q '^chart-testing-control-plane$'; then
              echo "FAIL: cluster should not have been created"
              exit 1
            fi
          fi
          echo "PASS"
