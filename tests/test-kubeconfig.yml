name: Test custom kubeconfig path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cluster_name: test-kubeconfig-cluster
          kubeconfig: /tmp/my-kubeconfig.yaml
          wait: 60s

      - name: Assert kubeconfig file was created
        run: |
          echo "Checking kubeconfig file at /tmp/my-kubeconfig.yaml..."
          if [ ! -f /tmp/my-kubeconfig.yaml ]; then
            echo "FAIL: kubeconfig file was not created at /tmp/my-kubeconfig.yaml"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"
          echo "Kubeconfig contents (redacted):"
          grep -v "certificate-authority-data\|client-certificate-data\|client-key-data" /tmp/my-kubeconfig.yaml || true

      - name: Assert cluster is accessible using custom kubeconfig
        run: |
          echo "Checking cluster nodes using custom kubeconfig..."
          NODE_COUNT=$(kubectl --kubeconfig /tmp/my-kubeconfig.yaml get nodes --no-headers 2>/dev/null | wc -l)
          echo "Node count: $NODE_COUNT"
          if [ "$NODE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 node via custom kubeconfig"
            exit 1
          fi
          echo "PASS: cluster accessible via custom kubeconfig with $NODE_COUNT node(s)"

      - name: Cleanup cluster
        if: always()
        run: kind delete cluster --name test-kubeconfig-cluster || true
