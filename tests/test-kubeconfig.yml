name: Test kubeconfig input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cluster_name: test-kubeconfig-cluster
          kubeconfig: /tmp/test-kubeconfig.yaml
          wait: 60s

      - name: Assert kubeconfig file was created
        run: |
          echo "Checking kubeconfig file at /tmp/test-kubeconfig.yaml..."
          if [ ! -f /tmp/test-kubeconfig.yaml ]; then
            echo "FAIL: kubeconfig file was not created at /tmp/test-kubeconfig.yaml"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert cluster is accessible via custom kubeconfig
        run: |
          echo "Checking cluster via custom kubeconfig..."
          kubectl --kubeconfig /tmp/test-kubeconfig.yaml cluster-info
          if [ $? -ne 0 ]; then
            echo "FAIL: cluster is not accessible via custom kubeconfig"
            exit 1
          fi
          echo "PASS: cluster accessible via custom kubeconfig"

      - name: Cleanup cluster
        if: always()
        run: kind delete cluster --name test-kubeconfig-cluster || true
