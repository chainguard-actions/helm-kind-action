name: Test custom kubeconfig path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare kubeconfig directory
        run: mkdir -p /tmp/kube

      - id: action
        uses: .
        with:
          cluster_name: kubeconfig-test
          kubeconfig: /tmp/kube/custom-config
          wait: "60s"

      - name: Assert kubeconfig file was created at custom path
        run: |
          echo "Checking for kubeconfig at /tmp/kube/custom-config..."
          if [ ! -f /tmp/kube/custom-config ]; then
            echo "FAIL: kubeconfig file not found at /tmp/kube/custom-config"
            exit 1
          fi
          echo "PASS: kubeconfig file exists at custom path"
          echo "Kubeconfig contents (clusters section):"
          grep -A2 "clusters:" /tmp/kube/custom-config || true

      - name: Cleanup cluster
        if: always()
        run: |
          kind delete cluster --name kubeconfig-test || true
