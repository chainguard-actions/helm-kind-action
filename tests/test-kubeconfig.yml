name: Test kind cluster with custom kubeconfig path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cluster_name: "test-kubeconfig-cluster"
          kubeconfig: "/tmp/custom-kubeconfig.yaml"
          wait: "60s"

      - name: Assert custom kubeconfig file was created
        run: |
          echo "Checking custom kubeconfig file..."
          if [ ! -f "/tmp/custom-kubeconfig.yaml" ]; then
            echo "FAIL: expected kubeconfig file at /tmp/custom-kubeconfig.yaml"
            exit 1
          fi
          echo "Kubeconfig file exists"
          # Verify it contains cluster info
          if ! grep -q "kind-test-kubeconfig-cluster" /tmp/custom-kubeconfig.yaml; then
            echo "WARN: kubeconfig may not reference expected cluster name, checking content..."
            cat /tmp/custom-kubeconfig.yaml | head -20
          fi
          echo "PASS: custom kubeconfig file created"

      - name: Assert cluster is accessible via custom kubeconfig
        run: |
          echo "Checking cluster via custom kubeconfig..."
          KUBECONFIG=/tmp/custom-kubeconfig.yaml kubectl get nodes
          NODE_COUNT=$(KUBECONFIG=/tmp/custom-kubeconfig.yaml kubectl get nodes --no-headers | wc -l)
          echo "Node count: $NODE_COUNT"
          if [ "$NODE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 node via custom kubeconfig"
            exit 1
          fi
          echo "PASS: cluster accessible via custom kubeconfig"

      - name: Cleanup cluster
        if: always()
        run: kind delete cluster --name test-kubeconfig-cluster || true
