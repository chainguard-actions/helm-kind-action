name: Test kubeconfig input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cluster_name: test-kubeconfig-cluster
          kubeconfig: /tmp/test-kubeconfig.yaml
          wait: "60s"
      - name: Assert kubeconfig file was created
        run: |
          echo "Checking kubeconfig file at /tmp/test-kubeconfig.yaml..."
          if [ ! -f /tmp/test-kubeconfig.yaml ]; then
            echo "FAIL: kubeconfig file was not created at /tmp/test-kubeconfig.yaml"
            exit 1
          fi
          echo "Kubeconfig file exists. Contents (redacted):"
          grep -c "kind" /tmp/test-kubeconfig.yaml || true
          echo "PASS: kubeconfig file was created"
      - name: Assert cluster is reachable using custom kubeconfig
        run: |
          echo "Checking cluster nodes using custom kubeconfig..."
          kubectl --kubeconfig=/tmp/test-kubeconfig.yaml get nodes
          NODE_COUNT=$(kubectl --kubeconfig=/tmp/test-kubeconfig.yaml get nodes --no-headers | wc -l)
          echo "Node count: $NODE_COUNT"
          if [ "$NODE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 node"
            exit 1
          fi
          echo "PASS: cluster is reachable with custom kubeconfig"
