name: Test install only with config, kubeconfig and node_image inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare kind config file
        run: |
          mkdir -p /tmp/kind-test
          cat > /tmp/kind-test/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
          EOF
          cat /tmp/kind-test/kind-config.yaml
      - id: action
        uses: .
        with:
          install_only: "true"
          ignore_failed_clean: "true"
          config: /tmp/kind-test/kind-config.yaml
          kubeconfig: /tmp/kind-test/kubeconfig
          node_image: kindest/node:v1.33.1
          cluster_name: options-test
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert kind installed with default version
        run: |
          OUT="$(kind version)"
          echo "kind version: $OUT"
          if ! echo "$OUT" | grep -q "v0.33.0"; then
            echo "FAIL: expected kind v0.33.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert kubectl installed
        run: |
          OUT="$(kubectl version --client=true 2>&1)"
          echo "kubectl version: $OUT"
          if ! echo "$OUT" | grep -q "v1.37.1"; then
            echo "FAIL: expected kubectl v1.37.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert no cluster was created and kubeconfig untouched (install only)
        run: |
          if [ -e /tmp/kind-test/kubeconfig ]; then
            echo "FAIL: kubeconfig should not be written in install_only mode"
            exit 1
          fi
          CLUSTERS="$(kind get clusters 2>/dev/null || true)"
          echo "clusters: $CLUSTERS"
          if echo "$CLUSTERS" | grep -qx "options-test"; then
            echo "FAIL: cluster should not have been created"
            exit 1
          fi
          echo "PASS"
