name: Test basic kind cluster creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cluster_name: test-basic
          wait: "60s"
          version: "v0.31.0"
          kubectl_version: "v1.35.0"
      - name: Assert kind is installed
        run: |
          echo "Checking kind binary..."
          which kind || { echo "FAIL: kind not found in PATH"; exit 1; }
          kind --version
          echo "PASS: kind is installed"
      - name: Assert kubectl is installed
        run: |
          echo "Checking kubectl binary..."
          which kubectl || { echo "FAIL: kubectl not found in PATH"; exit 1; }
          kubectl version --client
          echo "PASS: kubectl is installed"
      - name: Assert cluster is running
        run: |
          echo "Checking cluster nodes..."
          kubectl get nodes || { echo "FAIL: could not get nodes"; exit 1; }
          NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
          echo "Node count: $NODE_COUNT"
          if [ "$NODE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 node"
            exit 1
          fi
          echo "PASS: cluster has $NODE_COUNT node(s)"
      - name: Assert cluster name
        run: |
          echo "Checking cluster name..."
          CLUSTERS=$(kind get clusters)
          echo "Clusters: $CLUSTERS"
          if ! echo "$CLUSTERS" | grep -q "test-basic"; then
            echo "FAIL: expected cluster 'test-basic' to exist"
            exit 1
          fi
          echo "PASS: cluster 'test-basic' exists"
