name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "v0.31.0"
          cluster_name: "my-test-cluster"
          wait: "30s"
          verbosity: "1"
          kubectl_version: "v1.35.0"
          install_only: "true"
          ignore_failed_clean: "true"
      - name: Assert kind is installed with correct version
        run: |
          echo "Checking kind is installed..."
          if ! command -v kind &>/dev/null; then
            echo "FAIL: kind binary not found in PATH"
            exit 1
          fi
          KIND_VERSION=$(kind version)
          echo "kind version: $KIND_VERSION"
          if ! echo "$KIND_VERSION" | grep -q "v0.31.0"; then
            echo "FAIL: expected kind version v0.31.0, got: $KIND_VERSION"
            exit 1
          fi
          echo "PASS: kind v0.31.0 installed"
      - name: Assert kubectl is installed with correct version
        run: |
          echo "Checking kubectl is installed..."
          if ! command -v kubectl &>/dev/null; then
            echo "FAIL: kubectl binary not found in PATH"
            exit 1
          fi
          KUBECTL_VERSION=$(kubectl version --client 2>&1 || true)
          echo "kubectl version: $KUBECTL_VERSION"
          echo "PASS: kubectl installed"
