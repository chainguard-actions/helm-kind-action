name: Test version_file with asdf .tool-versions format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version_file: tests/fixtures/tool-versions
          kubectl_version: v1.32.0
          install_only: "true"
          ignore_failed_clean: "true"
      - name: Assert kind version comes from .tool-versions
        run: |
          OUT="$(kind version)"
          echo "kind version: $OUT"
          if ! echo "$OUT" | grep -q "v0.30.0"; then
            echo "FAIL: expected kind v0.30.0 from tool-versions"
            exit 1
          fi
          echo "PASS"
