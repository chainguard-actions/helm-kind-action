name: Test config, kubeconfig, and node_image inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create kind config file
        run: |
          mkdir -p /tmp/kind-test
          cat > /tmp/kind-test/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
          EOF
          echo "Created kind config at /tmp/kind-test/kind-config.yaml"
      - id: action
        uses: .
        with:
          install_only: "true"
          config: "/tmp/kind-test/kind-config.yaml"
          kubeconfig: "/tmp/kind-test/kubeconfig"
          node_image: "kindest/node:v1.31.0"
      - name: Assert kind is installed
        run: |
          echo "Checking kind is installed..."
          if ! command -v kind &>/dev/null; then
            echo "FAIL: kind binary not found in PATH"
            exit 1
          fi
          KIND_VERSION=$(kind version)
          echo "kind version: $KIND_VERSION"
          echo "PASS: kind is installed with config/kubeconfig/node_image inputs provided"
