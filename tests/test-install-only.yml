name: Test install-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_only: "true"
          version: "v0.31.0"
          kubectl_version: "v1.35.0"
      - name: Assert kind is installed
        run: |
          echo "Checking kind binary..."
          if ! command -v kind &>/dev/null; then
            echo "FAIL: kind binary not found on PATH"
            exit 1
          fi
          KIND_VERSION="$(kind version 2>&1)"
          echo "kind version: $KIND_VERSION"
          echo "PASS: kind is installed"
      - name: Assert kubectl is installed
        run: |
          echo "Checking kubectl binary..."
          if ! command -v kubectl &>/dev/null; then
            echo "FAIL: kubectl binary not found on PATH"
            exit 1
          fi
          KUBECTL_VERSION="$(kubectl version --client 2>&1 || true)"
          echo "kubectl version: $KUBECTL_VERSION"
          echo "PASS: kubectl is installed"
      - name: Assert no cluster was created
        run: |
          echo "Checking that no kind cluster was created..."
          CLUSTERS="$(kind get clusters 2>&1 || true)"
          echo "clusters: $CLUSTERS"
          if echo "$CLUSTERS" | grep -q "chart-testing"; then
            echo "FAIL: cluster 'chart-testing' should not exist in install_only mode"
            exit 1
          fi
          echo "PASS: no cluster created in install_only mode"
