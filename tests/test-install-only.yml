name: Test install-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_only: "true"
          version: "v0.31.0"
          kubectl_version: "v1.35.0"
      - name: Assert kind is installed
        run: |
          echo "Checking kind binary..."
          which kind || { echo "FAIL: kind not found in PATH"; exit 1; }
          KIND_VERSION=$(kind --version)
          echo "kind version: $KIND_VERSION"
          echo "PASS: kind is installed"
      - name: Assert kubectl is installed
        run: |
          echo "Checking kubectl binary..."
          which kubectl || { echo "FAIL: kubectl not found in PATH"; exit 1; }
          kubectl version --client
          echo "PASS: kubectl is installed"
      - name: Assert no cluster was created
        run: |
          echo "Checking that no cluster was created..."
          CLUSTERS=$(kind get clusters 2>/dev/null || true)
          echo "Clusters: '$CLUSTERS'"
          if echo "$CLUSTERS" | grep -q "chart-testing"; then
            echo "FAIL: cluster should not have been created in install_only mode"
            exit 1
          fi
          echo "PASS: no cluster created in install_only mode"
