name: Test custom node image
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cluster_name: test-node-image-cluster
          node_image: kindest/node:v1.31.0
          wait: 60s

      - name: Assert cluster is running with specified node image
        run: |
          echo "Checking cluster nodes..."
          kubectl get nodes -o wide
          NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
          echo "Node count: $NODE_COUNT"
          if [ "$NODE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 node"
            exit 1
          fi
          echo "PASS: cluster is running with $NODE_COUNT node(s)"

      - name: Assert Kubernetes version matches node image
        run: |
          echo "Checking Kubernetes server version..."
          SERVER_VERSION=$(kubectl version --short 2>/dev/null | grep "Server Version" || kubectl version 2>/dev/null | grep "Server Version" || echo "")
          echo "Server version info: $SERVER_VERSION"
          if echo "$SERVER_VERSION" | grep -q "v1.31"; then
            echo "PASS: server version matches expected v1.31"
          else
            # Version check is best-effort; cluster running is the main assertion
            echo "INFO: version string did not match v1.31 exactly, but cluster is running"
            echo "PASS"
          fi

      - name: Cleanup cluster
        if: always()
        run: kind delete cluster --name test-node-image-cluster || true
